<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Girassol Animado Premium - Presente romântico com visual aprimorado e efeitos especiais">
<meta name="theme-color" content="#1a1a2e">
<meta name="author" content="Rubens Pereira Fernandes">
<title>Girassol Premium ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    --accent-gold: #FFD700;
    --accent-pink: #FF6B9D;
    --accent-green: #4ECDC4;
    --text-primary: #FFFFFF;
    --text-secondary: rgba(255,255,255,0.7);
    --card-bg: rgba(255,255,255,0.05);
    --card-border: rgba(255,255,255,0.1);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    background: var(--bg-gradient);
    font-family: 'Poppins', sans-serif;
    color: var(--text-primary);
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  /* Animação de fundo com estrelas */
  .stars {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    animation: twinkle 3s ease-in-out infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.5); }
  }

  /* Container principal */
  .container {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    max-width: 900px;
    width: 100%;
  }

  /* Título principal */
  .title {
    text-align: center;
    animation: fadeInDown 1s ease-out;
  }

  .title h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 700;
    background: linear-gradient(45deg, var(--accent-gold), var(--accent-pink), var(--accent-green));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
    text-shadow: 0 0 30px rgba(255, 107, 157, 0.3);
  }

  .title p {
    color: var(--text-secondary);
    font-size: 1rem;
    font-weight: 300;
  }

  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Card principal */
  .main-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: 40px;
    backdrop-filter: blur(20px);
    box-shadow: 
      0 25px 50px rgba(0,0,0,0.3),
      inset 0 1px 0 rgba(255,255,255,0.1);
    width: 100%;
    max-width: 800px;
    animation: fadeInUp 1s ease-out 0.3s both;
    position: relative;
    overflow: hidden;
  }

  .main-card::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,215,0,0.1) 0%, transparent 50%);
    animation: rotateGlow 20s linear infinite;
    pointer-events: none;
  }

  @keyframes rotateGlow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Girassol Container */
  .sunflower-container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 30px 0;
    position: relative;
  }

  .sunflower {
    position: relative;
    width: 300px;
    height: 400px;
    animation: float 6s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-20px) rotate(2deg); }
  }

  /* Cabeça do girassol */
  .head {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 200px;
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(1.05); }
  }

  /* Pétalas */
  .petals {
    position: absolute;
    width: 100%;
    height: 100%;
    animation: rotateSlow 30s linear infinite;
  }

  @keyframes rotateSlow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .petal {
    position: absolute;
    width: 25px;
    height: 80px;
    background: linear-gradient(180deg, #FFE135 0%, #FFD700 50%, #FFA500 100%);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    top: 50%;
    left: 50%;
    transform-origin: center 80px;
    margin-left: -12.5px;
    margin-top: -80px;
    box-shadow: 
      0 4px 15px rgba(255, 165, 0, 0.4),
      inset 0 -10px 20px rgba(255, 140, 0, 0.3);
    transition: transform 0.3s ease, filter 0.3s ease;
  }

  .petal:hover {
    transform: rotate(var(--rotation)) scale(1.1);
    filter: brightness(1.2) drop-shadow(0 0 10px rgba(255, 215, 0, 0.8));
  }

  /* Núcleo */
  .center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 70px;
    height: 70px;
    background: radial-gradient(circle at 30% 30%, #5D4037 0%, #3E2723 50%, #1B0000 100%);
    border-radius: 50%;
    box-shadow: 
      0 8px 25px rgba(0,0,0,0.5),
      inset 0 -5px 15px rgba(0,0,0,0.5),
      0 0 30px rgba(93, 64, 55, 0.3);
    z-index: 5;
  }

  .center::after {
    content: '';
    position: absolute;
    top: 10%;
    left: 15%;
    width: 30%;
    height: 30%;
    background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
    border-radius: 50%;
  }

  /* Caule */
  .stem {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 12px;
    height: 200px;
    background: linear-gradient(90deg, #228B22 0%, #32CD32 50%, #228B22 100%);
    border-radius: 6px;
    box-shadow: 
      inset 2px 0 5px rgba(255,255,255,0.2),
      inset -2px 0 5px rgba(0,0,0,0.2);
  }

  .stem::before {
    content: '';
    position: absolute;
    top: 30%;
    left: -40px;
    width: 60px;
    height: 30px;
    background: linear-gradient(135deg, #228B22 0%, #32CD32 100%);
    border-radius: 0 50% 50% 0;
    transform: rotate(-20deg);
    animation: leafSway 4s ease-in-out infinite;
  }

  .stem::after {
    content: '';
    position: absolute;
    top: 60%;
    right: -35px;
    width: 50px;
    height: 25px;
    background: linear-gradient(135deg, #32CD32 0%, #228B22 100%);
    border-radius: 50% 0 0 50%;
    transform: rotate(20deg);
    animation: leafSway 4s ease-in-out infinite reverse;
  }

  @keyframes leafSway {
    0%, 100% { transform: rotate(-20deg) translateX(0); }
    50% { transform: rotate(-15deg) translateX(5px); }
  }

  /* Mensagem */
  .message {
    text-align: center;
    margin-top: 30px;
  }

  .message h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    color: var(--accent-pink);
    margin-bottom: 15px;
    text-shadow: 0 0 20px rgba(255, 107, 157, 0.5);
  }

  .message p {
    color: var(--text-secondary);
    font-size: 1rem;
    line-height: 1.8;
    max-width: 500px;
    margin: 0 auto;
  }

  .message .highlight {
    color: var(--accent-gold);
    font-weight: 600;
  }

  /* Botão CTA */
  .cta-button {
    display: inline-block;
    padding: 15px 40px;
    background: linear-gradient(135deg, var(--accent-pink) 0%, #FF8E53 100%);
    color: white;
    text-decoration: none;
    border-radius: 50px;
    font-weight: 600;
    font-size: 1rem;
    margin-top: 30px;
    box-shadow: 
      0 10px 30px rgba(255, 107, 157, 0.4),
      0 0 0 0 rgba(255, 107, 157, 0);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .cta-button::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transition: left 0.5s ease;
  }

  .cta-button:hover {
    transform: translateY(-3px);
    box-shadow: 
      0 15px 40px rgba(255, 107, 157, 0.5),
      0 0 0 5px rgba(255, 107, 157, 0.2);
  }

  .cta-button:hover::before {
    left: 100%;
  }

  /* Footer */
  .footer {
    margin-top: 40px;
    text-align: center;
    color: var(--text-secondary);
    font-size: 0.85rem;
    animation: fadeInUp 1s ease-out 0.6s both;
  }

  .footer a {
    color: var(--accent-gold);
    text-decoration: none;
    transition: color 0.3s ease;
  }

  .footer a:hover {
    color: var(--accent-pink);
  }

  /* Partículas douradas */
  .particles {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: var(--accent-gold);
    border-radius: 50%;
    opacity: 0;
    animation: floatParticle 8s ease-in-out infinite;
  }

  @keyframes floatParticle {
    0% { opacity: 0; transform: translateY(100vh) scale(0); }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-100vh) scale(1); }
  }

  /* Responsividade */
  @media (max-width: 768px) {
    .main-card {
      padding: 25px;
      margin: 10px;
    }

    .sunflower {
      width: 200px;
      height: 280px;
    }

    .head {
      width: 140px;
      height: 140px;
    }

    .petal {
      width: 18px;
      height: 55px;
      transform-origin: center 55px;
      margin-left: -9px;
      margin-top: -55px;
    }

    .center {
      width: 50px;
      height: 50px;
    }

    .stem {
      height: 140px;
      width: 10px;
    }

    .message h2 {
      font-size: 1.4rem;
    }
  }

  @media (max-width: 480px) {
    .title h1 {
      font-size: 1.8rem;
    }

    .message p {
      font-size: 0.9rem;
    }
  }

  /* Reduzir movimento */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>

  <!-- Estrelas de fundo -->
  <div class="stars" id="stars"></div>

  <!-- Partículas douradas -->
  <div class="particles" id="particles"></div>

  <!-- Container principal -->
  <div class="container">
    
    <!-- Título -->
    <div class="title">
      <h1>🌻 Girassol Animado</h1>
      <p>Um presente que floresce para você</p>
    </div>

    <!-- Card principal -->
    <div class="main-card">
      
      <!-- Girassol -->
      <div class="sunflower-container">
        <div class="sunflower">
          <!-- Cabeça -->
          <div class="head">
            <div class="petals" id="petals"></div>
            <div class="center"></div>
          </div>
          <!-- Caule -->
          <div class="stem"></div>
        </div>
      </div>

      <!-- Mensagem -->
      <div class="message">
        <h2>Para Você 💛</h2>
        <p>
          Assim como este girassol busca a luz do sol, 
          <span class="highlight">eu busco você</span> em cada momento. 
          Cada pétala que floresce representa um dos nossos 
          <span class="highlight">momentos especiais juntos</span>.
        </p>
      </div>

      <!-- Botão CTA -->
      <div style="text-align: center;">
        <a href="index.html" class="cta-button">
          🌻 Ver Versão Completa
        </a>
      </div>

    </div>

    <!-- Footer -->
    <div class="footer">
      <p>Feito com 💛 por <a href="https://github.com/Rubensdj" target="_blank">Rubens Pereira Fernandes</a></p>
    </div>

  </div>

  <script>
    // Gerar estrelas
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 100; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.animationDelay = Math.random() * 3 + 's';
      star.style.animationDuration = (2 + Math.random() * 2) + 's';
      starsContainer.appendChild(star);
    }

    // Gerar pétalas
    const petalsContainer = document.getElementById('petals');
    const numPetals = 16;
    for (let i = 0; i < numPetals; i++) {
      const petal = document.createElement('div');
      petal.className = 'petal';
      const rotation = (360 / numPetals) * i;
      petal.style.setProperty('--rotation', rotation + 'deg');
      petal.style.transform = `rotate(${rotation}deg)`;
      petalsContainer.appendChild(petal);
    }

    // Gerar partículas douradas
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 30; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDelay = Math.random() * 8 + 's';
      particle.style.animationDuration = (6 + Math.random() * 4) + 's';
      particlesContainer.appendChild(particle);
    }

    // Efeito de parallax no mouse
    document.addEventListener('mousemove', (e) => {
      const sunflower = document.querySelector('.sunflower');
      const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
      const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
      sunflower.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
    });
  </script>

</body>
</html>
